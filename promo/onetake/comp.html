  el.style.filter = blur > 0.25 ? 'blur(' + blur.toFixed(1) + 'px)' : 'none';
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&#62;');
const E = { chat: $('chat'), inner: $('inner'), li: $('listinner'), pill: $('pill'), send: $('send'), cover: $('cover'),
  rail: $('rail'), opener: $('opener'), whale: $('whale'), seal: $('seal'), endlab: $('endlab'),
  url: $('url'), stats: $('stats'), tagline: $('tagline'), cursor: $('cursor'), flash: $('flash'),
  sky: $('sky'), world: $('world'), inside: $('inside') };
const sctx = E.sky.getContext('2d'), cctx = E.cover.querySelector('canvas').getContext('2d');

const OPENER = ['群里有', '一条', '鱼。'];
OPENER.forEach(w => { const s = document.createElement('span'); s.textContent = w; E.opener.appendChild(s); });
const opSpans = [...E.opener.children];

const rowObjs = ROWS_TXT.map((r, i) => {
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = '<div class="k">' + r.k + '</div><div class="t">' + r.t + '</div>';
  E.li.appendChild(d); return { el: d, at: ROWS[i] };
});
const bigRow = document.createElement('div');
bigRow.className = 'row big';
bigRow.innerHTML = '<div class="t">' + ROW_BIG_TXT + '<span class="sub">' + ROW_BIG_SUB + '</span></div>';
E.li.appendChild(bigRow);
const bigRowO = { el: bigRow, at: ROW_BIG };
const statEls = STATS_TXT.map(s => {
  const d = document.createElement('div'); d.className = 'stat';
  d.innerHTML = '<div class="n">' + s[0] + '</div><div class="l">' + s[1] + '</div>';
  E.stats.appendChild(d); return d;
});

MSGS.forEach(m => {
  const d = document.createElement('div');
  d.className = 'msg ' + m.who + (m.flash ? ' flash' : '') + (m.hit ? ' hit' : '');
  d.id = m.id;
  if (m.kind === 'link') {
    d.innerHTML = '<div class="linkcard"><div class="ic">🔗</div><div>' +
      '<div class="u">v.douyin.com/xxxxxxx/</div><div class="p">抖音 · 分享链接</div></div></div>';
  } else if (m.kind === 'card') {
    d.innerHTML = '<div class="cardmsg"><div class="cov"><div class="tag">封面（示例占位）</div></div><div class="bd">' +
      '<h5>深夜食堂：一个人也要好好吃饭</h5>' +
      '<div class="meta"><b>作者</b> 示例作者　·　<b>时长</b> 00:14</div>' +
      '<div class="btn">🎬 无水印视频直链</div></div></div>';
  } else if (m.kind === 'swap') {
    d.innerHTML = '<div class="bbl"><div class="swapbox"><span class="sa">' + m.a + '</span>' +
      '<span class="sb">' + m.b + '</span></div></div>';
  } else {
    d.innerHTML = '<div class="bbl">' + m.txt + '</div>';
  }
  E.li.appendChild(d); m.el = d;
});

/* ══════════ 3 · 量一次（世界坐标，此刻 #world 未变换） ══════════ */
let COVER_WORLD = { x: 0, y: 0, w: 658, h: 286 };
function measure() {
  E.world.style.transform = 'none';
  E.chat.style.left = CHAT.x + 'px'; E.chat.style.top = CHAT.y + 'px';
  E.chat.style.width = CHAT.w + 'px'; E.chat.style.height = CHAT.h + 'px';
  E.chat.style.borderRadius = '22px'; E.chat.style.opacity = '0';
  let y = 22;
  MSGS.forEach(m => {
    const r = m.el.getBoundingClientRect();
    m.w = Math.ceil(r.width) + 4;                 // +4：像素取整的余量，否则边界上会折行
    m.h = Math.ceil(r.height);
    m.x = (m.who === 'user') ? LIST.w - m.w : 0;
    m.y = y; y += m.h + 18;
    m.el.style.left = m.x + 'px'; m.el.style.top = m.y + 'px'; m.el.style.width = m.w + 'px';
  });
  let ry = y + 10;
  rowObjs.forEach(r => {
    r.h = Math.ceil(r.el.getBoundingClientRect().height); r.y = ry; ry += r.h + 13;
    r.el.style.left = '0px'; r.el.style.top = r.y + 'px';
  });
  bigRowO.h = Math.ceil(bigRow.getBoundingClientRect().height); bigRowO.y = ry + 8;
  bigRow.style.left = '0px'; bigRow.style.top = bigRowO.y + 'px'; bigRow.style.width = LIST.w + 'px';
  const card = MSGS.find(m => m.kind === 'card');
  COVER_WORLD = { x: LIST.x + card.x + 1, y: LIST.y + card.y + 1, w: 658, h: 286 };
}

/* ══════════ 4 · 画面 ══════════ */
const FRAME = { x: 0, y: 0, w: 1920, h: 1080 };

function drawSky(cam, t) {
  const c = sctx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 1920, 1080);
  const lv = 0.10 + 0.24 * Math.max(0, 1 - Math.abs(t - 6.68) / 0.5);
  const lf = OM.lightField(clamp(lv, 0, 0.44));
  const g = c.createRadialGradient(lf.cx, lf.cy, 0, lf.cx, lf.cy, lf.rx);
  g.addColorStop(0, 'rgba(10,132,255,.14)'); g.addColorStop(0.42, 'rgba(10,132,255,.055)');
  g.addColorStop(1, 'rgba(10,132,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  const L = OM.lattice(cam, { depth: 1.35, spacing: 132, px: 1.5 });
  c.setTransform(L.matrix[0], L.matrix[1], L.matrix[2], L.matrix[3], L.matrix[4], L.matrix[5]);
  c.fillStyle = 'rgba(245,245,247,.07)';
  for (let x = L.x0; x <= L.x1; x += L.spacing)
    for (let y = L.y0; y <= L.y1; y += L.spacing) { c.beginPath(); c.arc(x, y, L.r, 0, 6.2832); c.fill(); }
  c.setTransform(1, 0, 0, 1, 0, 0);
}

function drawCover(t) {
  const c = cctx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 1920, 1080);
  const open = clamp(seg(t, COVER_A[0], COVER_A[1]) - seg(t, COVER_B[0], COVER_B[1]), 0, 1);
  if (open <= 0.001) return;
  c.fillStyle = '#0E0E10'; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(255,255,255,.032)'; c.lineWidth = 2;
  for (let y = 0; y < 1080; y += 26) { c.beginPath(); c.moveTo(0, y); c.lineTo(1920, y); c.stroke(); }
  const p = clamp(seg(t, 14.5, 19.2), 0, 1);
  c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(150, 962, 1620, 4);
  c.fillStyle = '#0A84FF'; c.fillRect(150, 962, 1620 * p, 4);
  c.font = LOOK.font('mono', 26); c.fillStyle = '#8A8A90'; c.textAlign = 'left';
  c.fillText('00:' + String(Math.round(p * 14)).padStart(2, '0') + ' / 00:14', 150, 940);
  c.textAlign = 'center'; c.fillStyle = '#6E6E73'; c.font = LOOK.font('text', 24);
  c.fillText('视频画面（示例占位）', 960, 120);
}

function seek(t) {
  const cam = camAt(t);
  E.world.style.transform = 'matrix(' + OM.view(cam).join(',') + ')';
  drawSky(cam, t);
  drawCover(t);

  /* ── 封面：从卡片里长到满屏，再收回去（carry：这个容器变成下一场） ── */
  const open = clamp(seg(t, COVER_A[0], COVER_A[1]) - seg(t, COVER_B[0], COVER_B[1]), 0, 1);
  const cb = t >= COVER_B[0]
    ? OM.morphRect(t, COVER_B[0], COVER_B[1], FRAME, COVER_WORLD, { curve: ease.expoInOut })
    : OM.morphRect(t, COVER_A[0], COVER_A[1], COVER_WORLD, FRAME, { curve: ease.expoInOut });
  E.cover.style.left = cb.x.toFixed(1) + 'px'; E.cover.style.top = cb.y.toFixed(1) + 'px';
  E.cover.style.width = cb.w.toFixed(1) + 'px'; E.cover.style.height = cb.h.toFixed(1) + 'px';
  E.cover.style.borderRadius = lerp(21, 0, open).toFixed(1) + 'px';
  E.cover.style.opacity = open <= 0.001 ? '0' : '1';

  /* ── 满屏之后压在上面的说明 ── */
  { const k = OM.popIn(t, INSIDE[0], { rise: 26, s0: .96, omega: 16 });
    const out = 1 - clamp(seg(t, INSIDE[1] - 0.3, INSIDE[1]), 0, 1);
    const vis = t >= INSIDE[0] - 0.05 && t < INSIDE[1];
    place(E.inside, 0, 700 + k.dy, k.s, vis ? k.op * out : 0);
    E.inside.style.width = '1920px'; }

  /* ── 开场 ── */
  { const out = ssstep(OP_OUT[0], OP_OUT[1], t);
    E.opener.style.opacity = 1 - out;
    E.opener.style.transform = 'translateY(' + (-out * 46).toFixed(1) + 'px)';
    opSpans.forEach((s, i) => { const w = OM.wordRise(t, T_OP[i], { dist: 34, zeta: .58, omega: 20 });
      s.style.opacity = w.op * (1 - out);
      s.style.transform = 'translateY(' + w.y.toFixed(1) + 'px) scale(' + w.s.toFixed(4) + ')'; }); }

  /* ── 窗口从那个小圆点长出来；结尾又把整个窗口收回头像那一点（carry） ── */
  { const rc = OM.morphRect(t, CHAT_IN, CHAT_IN + CHAT_SPAN, DOT, CHAT, { spring: { zeta: 0.74, omega: 15 } });
    const kc = clamp(spring(t - CHAT_IN, .74, 15), 0, 1);
    const rr = t < CHAT_IN ? DOT : rc;
    E.chat.style.left = rr.x.toFixed(1) + 'px'; E.chat.style.top = rr.y.toFixed(1) + 'px';
    E.chat.style.width = rr.w.toFixed(1) + 'px'; E.chat.style.height = rr.h.toFixed(1) + 'px';
    E.chat.style.borderRadius = lerp(999, 22, kc).toFixed(1) + 'px';
    /* 内容跟着窗口一起缩放 —— 这才是"从一个小圆点长出来"，而不是裁了个角 */
    E.inner.style.transformOrigin = '0 0';
    E.inner.style.transform = 'scale(' + (rr.w / CHAT.w).toFixed(5) + ')';
    if (t >= FOLD0) {
      const k = clamp(spring(t - FOLD0, 0.72, 12), 0, 1);
      E.chat.style.transform = 'scale(' + lerp(1, 0.02, k).toFixed(5) + ') rotate(' + (k * 0.22).toFixed(4) + 'rad)';
      E.chat.style.opacity = String(1 - clamp(seg(t, FOLD0 + 0.52, FOLD1), 0, 1));
    } else {
      E.chat.style.transform = 'none';
      E.chat.style.opacity = t < CHAT_IN ? '0' : '1';
    } }

  /* ── 消息 ── */
  { let scroll = 0;
    MSGS.forEach(m => {
      if (t < m.at - 0.02) { m.el.style.opacity = '0'; return; }
      const from = (m.who === 'user') ? SENDP : AVATAR;
      const k = Math.min(1.06, Math.max(0, spring(t - m.at, 0.66, 17)));
      const kk = Math.min(1, k);
      const sx = m.x + m.w / 2, sy = m.y + m.h / 2;
      const s = lerp(0.16, 1, kk);
      let dx = lerp(from.x - sx, 0, kk), dy = lerp(from.y - sy, 0, kk);
      let extra = '';
      if (m.hit) { const im = OM.impact(t, m.hit, { decay: 8, omega: 24 }); extra = 'rotate(' + (im.r * 0.45).toFixed(4) + 'rad)'; }
      let op = 1;
      if (m.out) op *= 1 - clamp(seg(t, m.out, m.out + 0.28), 0, 1);
      if (m.kind === 'card') op *= 1 - clamp(seg(t, COVER_A[0] + 0.10, COVER_A[1]), 0, 1) * (t < COVER_B[1] ? 1 : 0);
      if (t >= FOLD0) op *= 1 - clamp(seg(t, FOLD0 + 0.55, FOLD1), 0, 1);   // 跟着窗口一起收
      place(m.el, dx, dy, s, op, 0, extra);
      if (t >= m.at && !m.out && t < FOLD0) scroll = Math.max(scroll, m.y + m.h);
      if (m.kind === 'swap') {
        const sp = ssstep(SWAP, SWAP + 0.24, t);
        const A = m.el.querySelector('.sa'), B = m.el.querySelector('.sb');
        const bh = A.getBoundingClientRect().height / cam.zoom || 52;
        A.style.opacity = String(1 - sp);
        B.style.opacity = String(sp);
        A.style.transform = 'translateY(' + (-sp * bh).toFixed(1) + 'px)';
        B.style.transform = 'translateY(' + ((1 - sp) * bh).toFixed(1) + 'px)';
        if (t >= SWAP) {
          const im = OM.impact(t, SWAP, { decay: 9, omega: 26 });
          m.el.style.transform += ' scale(' + (1 + Math.abs(im.r) * 0.35).toFixed(4) + ')';
        }
      }
    });
    rowObjs.concat([bigRowO]).forEach(r => {
      if (t < r.at - 0.02) { r.el.style.opacity = '0'; return; }
      const k = Math.min(1.06, Math.max(0, spring(t - r.at, 0.62, 16)));
      let op = 1;
      if (r === bigRowO) op *= 1 - clamp(seg(t, ROW_BIG_OUT, ROW_BIG_OUT + 0.3), 0, 1);
      if (t >= FOLD0) op *= 1 - clamp(seg(t, FOLD0 + 0.55, FOLD1), 0, 1);
      place(r.el, 0, lerp(30, 0, Math.min(1, k)), lerp(0.94, 1, Math.min(1, k)), op);
      if (t >= r.at && t < FOLD0) scroll = Math.max(scroll, r.y + r.h);
    });
    E.li.style.transform = 'translateY(' + (-Math.max(0, scroll + 22 - LIST.h)).toFixed(1) + 'px)'; }

  /* ── 输入栏：手敲进去的字（按下那一刻就清空） ── */
  { let txt = '', caret = false;
    Object.keys(TYPING).forEach(id => {
      const w = TYPING[id];
      if (t >= w[0] && t < w[1]) {
        const ty = OM.typeOn(t, w[0], w[2], { cps: Math.max(16, w[2].length / (w[1] - w[0] - 0.08)) });
        txt = ty.str; caret = !!ty.caret;
      }
    });
    E.pill.innerHTML = txt ? (esc(txt) + (caret ? '<i></i>' : '')) : '<span class="ph">说点什么…</span>';
    const ps = CLICKS.map(c => OM.press(t, c));
    const any = ps.reduce((a, b) => (Math.abs(b.s - 1) > Math.abs(a.s - 1) ? b : a));
    E.send.style.transform = 'scale(' + any.s.toFixed(3) + ')';
    E.send.style.background = any.active ? '#30D158' : 'var(--accent)'; }

  /* ── 人设抽屉 + 换人设 ── */
  { const ei = OM.popIn(t, RAIL_IN, { rise: 44, s0: .95, omega: 15 });
    const vis = t >= RAIL_IN - 0.05 && t < FOLD0;
    place(E.rail, ei.dy * 0.5, ei.dy, ei.s, vis ? 1 : 0);
    const on = t >= SWAP;
    const rib = OM.ribbon(t, [SWAP], { amp: 34, decay: 6, omega: 20, tilt: .12 });
    $('chip0').className = 'chip' + (on ? '' : ' on');
    $('chip1').className = 'chip' + (on ? ' on' : '');
    $('chip0').style.transform = 'translateX(' + (on ? -rib.shift * 0.22 : 0).toFixed(1) + 'px)';
    const p = OM.press(t, CLICKS[5]);
    $('chip1').style.transform = 'translateX(' + (on ? rib.shift * 0.08 : 0).toFixed(1) + 'px) scale(' + p.s.toFixed(3) + ')'; }

  /* ── 踩雷那一下的红光 ── */
  { const f = Math.max(0, 1 - Math.abs(t - 6.68) / 0.42);
    E.flash.style.opacity = (f * f * 0.9).toFixed(3); }

  /* ── 折叠 → 那只鲸鱼 ── */
  { const mv = OM.hop(t, WHALE0, WHALE1, { x: AVATAR.x, y: AVATAR.y }, { x: 960, y: 356 }, { height: -40, curve: ease.smoother });
    const w = OM.popIn(t, WHALE0, { rise: 26, s0: .55, omega: 14 });
    const out = 1 - clamp(seg(t, 30.5, 31.1), 0, 1);
    const sc = lerp(0.42, 1.5, clamp(seg(t, WHALE0, WHALE1), 0, 1));
    place(E.whale, mv.x - 48 * sc, mv.y - 48 * sc, sc, t >= WHALE0 - 0.05 ? w.op * out : 0);
    const sl = OM.seal(t, SEAL0, SEAL1, { r: 215, turns: 0.7 });
    E.seal.style.left = (960 - sl.r) + 'px'; E.seal.style.top = (500 - sl.r) + 'px';
    E.seal.style.width = (sl.r * 2) + 'px'; E.seal.style.height = (sl.r * 2) + 'px';
    E.seal.style.transform = 'rotate(' + (sl.rot * 57.3).toFixed(1) + 'deg)';
    E.seal.style.opacity = String(0.5 * (t >= SEAL0 ? (1 - clamp(seg(t, SEAL1 - 0.3, SEAL1), 0, 1)) : 0)); }

  /* ── 结尾 ── */
  { const l = OM.maskRise(t, END_LAB, 0, { dist: 1 });
    place(E.endlab, 0, 468 + l.y * 24, 1, l.visible ? 1 : 0);
    const ty = OM.typeOn(t, URL0, 'github.com/RelyLinYu/Xiaojingyu-QQbot', { cps: URL_CPS });
    E.url.innerHTML = esc(ty.str) + (ty.done || t < URL0 ? '' : '<span style="opacity:.6">▌</span>');
    E.url.style.opacity = t >= URL0 ? '1' : '0';
    E.url.style.transform = 'translateY(0px)';
    statEls.forEach((s, i) => { const k = OM.popIn(t, STATS[i], { rise: 26, s0: .88, omega: 18 });
      place(s, 0, k.dy, k.s, t >= STATS[i] - 0.02 ? k.op : 0); });
    const tg = OM.popIn(t, TAGLINE, { rise: 18, s0: .97, omega: 16 });
    place(E.tagline, 0, tg.dy, tg.s, t >= TAGLINE - 0.02 ? tg.op : 0);
    E.tagline.innerHTML = '<b>蓝色大肥鱼</b> · 不是一个问答接口，是群里那个有脾气的家伙'; }

  /* ── 手 ── */
  { const cu = OM.cursor(t, HAND, CLICKS);
    const vis = t >= 1.45 && t < 20.65;
    E.cursor.style.opacity = vis ? '1' : '0';
    E.cursor.style.transform = 'translate(' + (cu.x - 4).toFixed(1) + 'px,' + (cu.y - 3).toFixed(1) + 'px) scale(' + cu.s.toFixed(3) + ')'; }

  $('hud').textContent = 't=' + t.toFixed(3);
  return Promise.resolve();
}

window.__seek = async t => { await seek(t); return true; };
window.__ready = LOOK.ready.then(() => {
  measure();
  E.chat.style.transformOrigin = (AVATAR.x - CHAT.x) + 'px ' + (AVATAR.y - CHAT.y) + 'px';  // 折叠时收向头像那一点
  E.inside.style.top = '0px';
  E.endlab.style.top = '0px';
  E.url.style.top = '518px';
  return seek(0);
});
const q = new URLSearchParams(location.search);
if (q.has('t')) __ready.then(() => seek(parseFloat(q.get('t'))));
if (q.has('hud')) $('hud').style.display = 'block';
if (q.has('play')) __ready.then(() => { const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
})();
</script>
